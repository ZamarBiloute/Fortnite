<fieldset>
    <legend>Si vous voulez contacter Martin Dracos pour en savoir plus</legend>

    <input type="password" id="pass" name="pass" pattern="[A-Z]{1}[a-z]{1}[0-9]{2}" title="Au moins 3 caractère alphanumérique" required>
